{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WordPress Project Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
        }
        .sidebar {
            background-color: #000;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .sidebar .btn {
            width: 100%;
            margin-bottom: 1rem;
            background-color: #b30000;
            border: none;
            color: white;
        }
        .sidebar .btn:hover {
            background-color: #ff1a1a;
        }
        .table-container {
            padding: 3rem;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar d-flex flex-column">
            <h4 class="text-white mb-4">Cognilabs</h4>
            <a href="{% url 'ceo' %}" class="btn">Dashboard</a>
            <a href="{% url 'payment_list' %}" class="btn">Payments</a>
            <a href="{% url 'project_toggle' %}" class="btn">WordPress Control</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 table-container">
            <h2 class="text-center mb-5 text-danger">WordPress Project Controls</h2>

            <div class="table-responsive">
                <table class="table table-dark table-bordered text-center align-middle">
                    <thead class="table-danger">
                        <tr>
                            <th>Project</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="fw-bold">cognilabs.uz</td>
                            <td>
                                <form method="post">
                                    {% csrf_token %}
                                    <button type="submit" name="toggle_site" value="toggle"
                                            class="btn {% if site_status %}btn-success{% else %}btn-danger{% endif %} py-3 px-5">
                                        {% if site_status %}
                                            ✅ Website is ON (Click to turn OFF)
                                        {% else %}
                                            ❌ Website is OFF (Click to turn ON)
                                        {% endif %}
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
